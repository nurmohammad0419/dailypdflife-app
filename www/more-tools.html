<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPdfLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Rotate, Page Numbers & Watermark</title>
<script src="vendor/pdf-lib.min.js"></script>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:30px;text-align:center}
  .box{background:#fff;max-width:700px;margin:0 auto 30px;padding:30px;border-radius:12px;box-shadow:0 2px 10px #0002}
  h1{margin-top:0}
  .rot h1{color:#f08c00} .num h1{color:#1c7ed6} .wm h1{color:#0ca678}
  input,select{margin:8px 0;padding:8px;font-size:15px}
  input[type=text]{width:70%}
  button{color:#fff;border:none;padding:12px 30px;font-size:16px;border-radius:8px;cursor:pointer}
  .rot button{background:#f08c00} .num button{background:#1c7ed6} .wm button{background:#0ca678}
</style>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="app-shell.js"></script>
<script src="result.js"></script>
</head>
<body>
<div class="box rot" id="rotate">
  <h1>Rotate PDF</h1>
  <input type="file" id="rotFile" accept="application/pdf"><br>
  <select id="angle">
    <option value="90">90° right</option>
    <option value="180">180° (upside down)</option>
    <option value="270">90° left</option>
  </select><br>
  <input type="text" id="rotPages" placeholder="Which pages? Leave empty for all (e.g. 1, 3-5)"><br>
  <button onclick="rotatePdf()">Rotate</button>
  <p id="s1"></p>
</div>
<div class="box num" id="numbers">
  <h1>Add Page Numbers</h1>
  <input type="file" id="numFile" accept="application/pdf"><br>
  <select id="pos">
    <option value="bc">Bottom centre</option>
    <option value="br">Bottom right</option>
    <option value="bl">Bottom left</option>
    <option value="tc">Top centre</option>
  </select>
  <select id="fmt">
    <option value="n">1, 2, 3</option>
    <option value="page">Page 1 of 10</option>
  </select><br>
  <button onclick="addNumbers()">Add Numbers</button>
  <p id="s2"></p>
</div>
<div class="box wm" id="watermark">
  <h1>Add Watermark</h1>
  <input type="file" id="wmFile" accept="application/pdf"><br>
  <input type="text" id="wmText" placeholder="Watermark text (English), e.g. CONFIDENTIAL"><br>
  <select id="wmColor">
    <option value="0.6,0.6,0.6">Grey</option>
    <option value="0.85,0.1,0.1">Red</option>
    <option value="0.1,0.3,0.8">Blue</option>
  </select>
  <select id="wmOpacity">
    <option value="0.15">Light</option>
    <option value="0.3" selected>Medium</option>
    <option value="0.5">Strong</option>
  </select><br>
  <button onclick="addWatermark()">Add Watermark</button>
  <p id="s3"></p>
</div>
<script>
const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
function download(bytes, name){
  DPLResult.file(new Blob([bytes], {type: "application/pdf"}), name);
}
async function load(id){
  const f = document.getElementById(id).files[0];
  if(!f){ alert(T("Choose a PDF first")); return null; }
  const doc = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption: true});
  return {doc, base: f.name.replace(/\.pdf$/i, "")};
}
function pick(text, total){
  if(!text.trim()) return [...Array(total).keys()];
  const set = new Set();
  text.split(",").forEach(part => {
    let [a, b] = part.trim().split("-").map(x => parseInt(x));
    if(isNaN(a)) return; if(isNaN(b)) b = a;
    for(let i = Math.max(1, a); i <= Math.min(total, b); i++) set.add(i - 1);
  });
  return [...set];
}
async function rotatePdf(){
  const r = await load("rotFile"); if(!r) return;
  const add = Number(document.getElementById("angle").value);
  const pages = r.doc.getPages();
  const list = pick(document.getElementById("rotPages").value, pages.length);
  list.forEach(i => {
    const cur = pages[i].getRotation().angle;
    pages[i].setRotation(degrees((cur + add) % 360));
  });
  download(await r.doc.save(), r.base + "-rotated.pdf");
  document.getElementById("s1").textContent = "Done! " + list.length + " pages rotated.";
}
async function addNumbers(){
  const r = await load("numFile"); if(!r) return;
  const font = await r.doc.embedFont(StandardFonts.Helvetica);
  const pos = document.getElementById("pos").value;
  const fmt = document.getElementById("fmt").value;
  const pages = r.doc.getPages(), total = pages.length, size = 11, m = 25;
  pages.forEach((p, i) => {
    const label = fmt === "n" ? String(i + 1) : "Page " + (i + 1) + " of " + total;
    const {width, height} = p.getSize();
    const w = font.widthOfTextAtSize(label, size);
    let x = (width - w) / 2, y = m;
    if(pos === "br") x = width - w - m;
    if(pos === "bl") x = m;
    if(pos === "tc") y = height - m - size;
    p.drawText(label, {x, y, size, font, color: rgb(0.2, 0.2, 0.2)});
  });
  download(await r.doc.save(), r.base + "-numbered.pdf");
  document.getElementById("s2").textContent = "Done! " + total + " pages numbered.";
}
async function addWatermark(){
  const text = document.getElementById("wmText").value.trim();
  if(!text){ alert(T("Enter the watermark text")); return; }
  if(/[^\x20-\x7E]/.test(text)){ alert(T("Only English characters are supported here for now")); return; }
  const r = await load("wmFile"); if(!r) return;
  const font = await r.doc.embedFont(StandardFonts.HelveticaBold);
  const [cr, cg, cb] = document.getElementById("wmColor").value.split(",").map(Number);
  const opacity = Number(document.getElementById("wmOpacity").value);
  r.doc.getPages().forEach(p => {
    const {width, height} = p.getSize();
    const diag = Math.sqrt(width*width + height*height);
    let size = 80;
    while(font.widthOfTextAtSize(text, size) > diag * 0.7 && size > 10) size -= 2;
    const w = font.widthOfTextAtSize(text, size);
    const ang = Math.atan2(height, width);
    const x = width/2 - (w/2) * Math.cos(ang) + (size/3) * Math.sin(ang);
    const y = height/2 - (w/2) * Math.sin(ang) - (size/3) * Math.cos(ang);
    p.drawText(text, {x, y, size, font, color: rgb(cr, cg, cb), opacity,
                      rotate: degrees(ang * 180 / Math.PI)});
  });
  download(await r.doc.save(), r.base + "-watermarked.pdf");
  document.getElementById("s3").textContent = "Done! The watermark has been added.";
}
</script>
<script src="nav.js"></script>
<script src="install.js"></script>
</body>
</html>
