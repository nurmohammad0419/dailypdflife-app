<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text on photo</title>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="app-shell.js"></script>
<script src="result.js"></script>
<style>
  .lay{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}
  .drop{display:block;text-align:center;cursor:pointer}
  .side h3:first-child{margin-top:0}
  .side select{width:100%}
  .side textarea{width:100%;min-height:72px;font-size:16px;resize:vertical;box-sizing:border-box}
  .layers{display:flex;gap:6px;flex-wrap:wrap}
  .layers button{padding:6px 10px !important;font-size:13px !important;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .layers button.on{background:#1b2030;color:#fff;border-color:#1b2030}
  .crow{display:flex;gap:8px;align-items:center}
  .crow input[type=color]{width:40px;height:34px;padding:0 !important;border:0;background:none}
  .crow select{flex:1}
  .styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .styles button{padding:7px 4px !important;font-size:12.5px !important}
  .styles button.on{background:#e8590c;color:#fff;border-color:#e8590c}
  .aligns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .aligns button{padding:6px !important}
  .aligns button.on{background:#1b2030;color:#fff}
  .rng{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-top:8px}
  .rng label{width:50px;font-weight:650}
  .rng input{flex:1}
  .row{display:flex;gap:6px;margin-top:10px}
  .row button{flex:1;padding:8px 4px !important;font-size:13px !important}
  .pri{background:#e8590c;color:#fff;border:0;width:100%;margin-top:16px}
  .stage{display:flex;justify-content:center;background:#e9ecf3;border-radius:12px;padding:16px}
  #cv{max-width:100%;max-height:74vh;box-shadow:0 3px 14px rgba(20,25,40,.18);touch-action:none;cursor:grab}
  @media(max-width:900px){.lay{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box">
  <label class="drop" id="drop">🅰 Choose a photo, or drag it here
    <input type="file" id="file" accept="image/*" hidden>
  </label>
</div>
<div class="lay" id="lay" style="display:none">
  <div class="box side">
    <h3>Text boxes</h3>
    <div class="layers" id="layers"></div>
    <div class="row"><button id="add">＋ Add text</button><button id="del">🗑 Delete</button></div>
    <h3>Text to write</h3>
    <textarea id="txt" dir="auto"></textarea>
    <h3>Style</h3>
    <div class="crow">
      <input type="color" id="color" value="#ffffff" title="Text colour">
      <select id="font">
        <option value="900|Impact, 'Arial Black', 'Segoe UI', sans-serif">Poster</option>
        <option value="700|'Segoe UI', Arial, sans-serif">Bold</option>
        <option value="400|'Segoe UI', Arial, sans-serif">Regular</option>
        <option value="700|Georgia, 'Times New Roman', serif">Classic</option>
        <option value="italic 700|Georgia, serif">Italic</option>
      </select>
    </div>
    <div class="styles" id="styles">
      <button data-s="outline" class="on">Outline</button>
      <button data-s="shadow">Shadow</button>
      <button data-s="box">Label</button>
    </div>
    <div class="aligns" id="aligns"><button data-a="left">⯇ Left</button><button data-a="center" class="on">≡ Centre</button><button data-a="right">Right ⯈</button></div>
    <div class="rng"><label>Size</label><input type="range" id="size" min="2" max="25" value="9" step="0.5"></div>
    <div class="rng"><label>Angle</label><input type="range" id="ang" min="-45" max="45" value="0"></div>
    <p class="note">Drag the text on the photo to move it.</p>
    <h3>Save as</h3>
    <select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select>
    <button class="pri" id="save">⬇ Save photo</button>
  </div>
  <div class="box">
    <div class="stage"><canvas id="cv"></canvas></div>
  </div>
</div>

<script src="nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
/* small words translated here only, so they never change text elsewhere */
const BNW = {"(empty)": "(খালি)"};
const W = s => (window.DPL_LANG === "bn" && BNW[s] != null) ? BNW[s] : s;
let img = null, name = "photo", layers = [], cur = 0, boxes = [];

function newLayer(txt, y){
  return {t: txt, x: 0.5, y: y, size: 9, color: "#ffffff", font: $("font").options[0].value, style: "outline", align: "center", ang: 0};
}
function fontOf(L, px){ const [w, fam] = L.font.split("|"); return w + " " + px + "px " + fam; }

/* draw every text box; returns their outlines for clicking */
function paint(g, W, H, showSel){
  g.drawImage(img, 0, 0, W, H);
  const out = [];
  layers.forEach((L, i) => {
    const lines = (L.t || "").split("\n");
    const fs = Math.max(6, W * L.size / 100), lh = fs * 1.15;
    g.save(); g.font = fontOf(L, fs);
    const widths = lines.map(s => g.measureText(s).width), mw = Math.max(1, ...widths), th = lh * lines.length;
    const cx = L.x * W, cy = L.y * H;
    g.translate(cx, cy); g.rotate(L.ang * Math.PI / 180);
    g.textBaseline = "middle"; g.textAlign = L.align;
    const ax = L.align === "left" ? -mw / 2 : L.align === "right" ? mw / 2 : 0;
    if(L.style === "box"){
      const p = fs * 0.35;
      g.fillStyle = isLight(L.color) ? "rgba(0,0,0,.72)" : "rgba(255,255,255,.88)";
      g.beginPath(); rr(g, -mw / 2 - p, -th / 2 - p * 0.6, mw + p * 2, th + p * 1.2, fs * 0.25); g.fill();
    }
    lines.forEach((s, k) => {
      const y = -th / 2 + lh * (k + 0.5);
      if(L.style === "outline"){ g.lineJoin = "round"; g.lineWidth = Math.max(2, fs * 0.14); g.strokeStyle = isLight(L.color) ? "#000" : "#fff"; g.strokeText(s, ax, y); }
      if(L.style === "shadow"){ g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = fs * 0.25; g.shadowOffsetY = fs * 0.06; }
      g.fillStyle = L.color; g.fillText(s, ax, y);
    });
    if(showSel && i === cur){ g.shadowColor = "transparent"; g.setLineDash([8, 6]); g.lineWidth = 2; g.strokeStyle = "#e8590c"; g.strokeRect(-mw / 2 - 8, -th / 2 - 8, mw + 16, th + 16); }
    g.restore();
    out.push({cx: cx, cy: cy, w: mw + 16, h: th + 16, a: L.ang * Math.PI / 180});
  });
  return out;
}
function rr(g, x, y, w, h, r){ g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function isLight(hex){ const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150; }

function render(){
  if(!img) return;
  const cv = $("cv"), k = Math.min(1, 1300 / Math.max(img.naturalWidth, img.naturalHeight));
  cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  boxes = paint(cv.getContext("2d"), cv.width, cv.height, true);
}
function panel(){
  const L = layers[cur], box = $("layers"); box.innerHTML = "";
  layers.forEach((l, i) => {
    const b = document.createElement("button"); b.textContent = (l.t || "").split("\n")[0] || W("(empty)");
    if(i === cur) b.className = "on"; b.onclick = () => { cur = i; panel(); render(); }; box.appendChild(b);
  });
  if(!L) return;
  $("txt").value = L.t; $("color").value = L.color; $("font").value = L.font; $("size").value = L.size; $("ang").value = L.ang;
  $("styles").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.s === L.style));
  $("aligns").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.a === L.align));
}
function load(f){
  if(!f || !/^image\//.test(f.type)) return;
  name = f.name.replace(/\.[^.]+$/, "");
  const im = new Image();
  im.onload = () => {
    img = im; $("lay").style.display = "";
    if(!layers.length){ layers = [newLayer(TT("TOP TEXT"), 0.1), newLayer(TT("BOTTOM TEXT"), 0.9)]; cur = 0; }
    panel(); render();
  };
  im.onerror = () => alert(TT("This image could not be opened:") + " " + f.name);
  im.src = URL.createObjectURL(f);
}
$("file").onchange = e => load(e.target.files[0]);
$("drop").ondragover = e => e.preventDefault();
$("drop").ondrop = e => { e.preventDefault(); load(e.dataTransfer.files[0]); };
$("add").onclick = () => { layers.push(newLayer(TT("Your text"), 0.5)); cur = layers.length - 1; panel(); render(); $("txt").focus(); $("txt").select(); };
$("del").onclick = () => { if(!layers.length) return; layers.splice(cur, 1); cur = Math.max(0, cur - 1); panel(); render(); };
const set = (k, v) => { if(layers[cur]){ layers[cur][k] = v; render(); } };
$("txt").oninput = () => { set("t", $("txt").value); const b = $("layers").children[cur]; if(b) b.textContent = $("txt").value.split("\n")[0] || W("(empty)"); };
$("color").oninput = () => set("color", $("color").value);
$("font").onchange = () => set("font", $("font").value);
$("size").oninput = () => set("size", Number($("size").value));
$("ang").oninput = () => set("ang", Number($("ang").value));
$("styles").querySelectorAll("button").forEach(b => b.onclick = () => { set("style", b.dataset.s); panel(); });
$("aligns").querySelectorAll("button").forEach(b => b.onclick = () => { set("align", b.dataset.a); panel(); });

/* click to pick a text box, drag to move it */
let drag = null;
function hit(x, y){
  for(let i = boxes.length - 1; i >= 0; i--){
    const b = boxes[i], dx = x - b.cx, dy = y - b.cy, c = Math.cos(-b.a), s = Math.sin(-b.a);
    const rx = dx * c - dy * s, ry = dx * s + dy * c;
    if(Math.abs(rx) <= b.w / 2 && Math.abs(ry) <= b.h / 2) return i;
  }
  return -1;
}
function pt(e){ const cv = $("cv"), r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height}; }
$("cv").addEventListener("pointerdown", e => {
  const p = pt(e), i = hit(p.x, p.y); if(i < 0) return;
  cur = i; panel(); render();
  drag = {sx: p.x, sy: p.y, x: layers[i].x, y: layers[i].y};
  $("cv").setPointerCapture(e.pointerId); e.preventDefault();
});
$("cv").addEventListener("pointermove", e => {
  if(!drag) return;
  const p = pt(e), cv = $("cv");
  layers[cur].x = Math.min(1, Math.max(0, drag.x + (p.x - drag.sx) / cv.width));
  layers[cur].y = Math.min(1, Math.max(0, drag.y + (p.y - drag.sy) / cv.height));
  render();
});
$("cv").addEventListener("pointerup", () => drag = null);

$("save").onclick = () => {
  if(!img){ alert(TT("Choose a photo first")); return; }
  const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  paint(c.getContext("2d"), c.width, c.height, false);
  const type = $("fmt").value;
  c.toBlob(b => DPLResult.file(b, name + "-text." + (type === "image/png" ? "png" : "jpg")), type, 0.92);
};
</script>
</body>
</html>
