<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protect PDF</title>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="app-shell.js"></script>
<script src="result.js"></script>
<script src="qpdf-run.js"></script>
<style>
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two input{width:100%}
  .perm label{display:flex;gap:8px;align-items:center;margin:7px 0}
  .go{background:#c92a2a;color:#fff;border:0;margin-top:14px}
  .ok{color:#17935a;font-weight:650}
  .bad{color:#c92a2a;font-weight:650}
  .meter{height:6px;border-radius:4px;background:#eceff5;margin-top:8px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;transition:.2s}
  .info{background:#f4f8ff;border:1px solid #dbe6ff;border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink-2)}
  .info b{color:var(--ink)}
  @media(max-width:620px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box">
  <h3>1. Choose a PDF</h3>
  <input type="file" id="file" accept="application/pdf">
  <h3>2. Set a password</h3>
  <div class="two">
    <input type="password" id="pw1" placeholder="Enter a password">
    <input type="password" id="pw2" placeholder="Repeat password">
  </div>
  <div class="meter"><i id="meter"></i></div>
  <p class="note" id="strength"></p>
  <label><input type="checkbox" id="show"> Show password</label>
  <h3>3. Once opened, allow</h3>
  <div class="perm">
    <label><input type="checkbox" id="pPrint" checked> Printing</label>
    <label><input type="checkbox" id="pCopy" checked> Copying text</label>
    <label><input type="checkbox" id="pMod"> Editing</label>
  </div>
  <button class="go" id="go">🔒 Protect it</button>
  <p id="status"></p>
</div>
<div class="box info">
  <p><b>Strong AES-256 encryption.</b> The same protection Adobe Acrobat uses. Your text, links and quality stay
  exactly as they were — nothing is turned into images.</p>
  <p><b>Keep the password safe.</b> Nobody, including us, can open the file without it.</p>
</div>

<script src="nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
$("show").onchange = () => { $("pw1").type = $("pw2").type = $("show").checked ? "text" : "password"; };
$("pw1").oninput = () => {
  const p = $("pw1").value;
  let s = 0;
  if(p.length >= 8) s++; if(p.length >= 12) s++;
  if(/[A-Z]/.test(p) && /[a-z]/.test(p)) s++;
  if(/\d/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++;
  const lv = [["#c92a2a", "Weak"], ["#c92a2a", "Weak"], ["#f08c00", "Fair"], ["#f08c00", "Fair"], ["#17935a", "Strong"], ["#17935a", "Very strong"]][s];
  $("meter").style.width = p ? (s + 1) * 16.6 + "%" : "0";
  $("meter").style.background = lv[0];
  $("strength").textContent = p ? TT("Password strength") + ": " + TT(lv[1]) : "";
};

$("go").onclick = async () => {
  const f = $("file").files[0], pw = $("pw1").value, st = $("status");
  if(!f){ alert(TT("Choose a PDF first")); return; }
  if(pw.length < 4){ alert(TT("Use a password of at least 4 characters")); return; }
  if(pw !== $("pw2").value){ alert(TT("The two passwords do not match")); return; }
  const owner = pw + "#" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  const args = ["--encrypt", pw, owner, "256",
                "--print=" + ($("pPrint").checked ? "full" : "none"),
                "--extract=" + ($("pCopy").checked ? "y" : "n"),
                "--modify=" + ($("pMod").checked ? "all" : "none"),
                "--", "/in.pdf", "/out.pdf"];
  const btn = $("go"); btn.disabled = true;
  st.className = ""; st.textContent = TT("Working... the PDF engine loads the first time (about 1 MB).");
  try{
    const bytes = new Uint8Array(await f.arrayBuffer());
    const probe = await DPLqpdf.run(["--is-encrypted", "/in.pdf"], bytes);
    if(probe.code === 0){
      st.className = "bad"; st.textContent = TT("This PDF is already protected. Unlock it first, then protect it again.");
      btn.disabled = false; return;
    }
    const r = await DPLqpdf.run(args, bytes);
    if(r.out && r.out.length && r.code !== 2){
      st.className = "ok"; st.textContent = TT("✅ Done! Do not forget the password — without it the file cannot be opened.");
      DPLResult.file(new Blob([r.out], {type: "application/pdf"}), f.name.replace(/\.pdf$/i, "") + "-protected.pdf");
    }else{
      st.className = "bad"; st.textContent = TT("This PDF could not be protected. If it already has a password, unlock it first.");
    }
  }catch(err){
    st.className = "bad"; st.textContent = TT("Something went wrong. Check your internet and try again.");
  }
  btn.disabled = false;
};
</script>
</body>
</html>
