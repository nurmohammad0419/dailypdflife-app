<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split & Compress PDF</title>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:30px;text-align:center}
  .box{background:#fff;max-width:700px;margin:0 auto 30px;padding:30px;border-radius:12px;box-shadow:0 2px 10px #0002}
  h1{margin-top:0}
  .split h1{color:#e5322d} .comp h1{color:#7b3fe4}
  input,select{margin:10px 0;padding:8px;font-size:15px}
  input[type=text]{width:80%}
  button{color:#fff;border:none;padding:12px 30px;font-size:16px;border-radius:8px;cursor:pointer}
  .split button{background:#e5322d} .comp button{background:#7b3fe4}
  label{display:block;margin:6px 0}
</style>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="app-shell.js"></script>
<script src="result.js"></script>
</head>
<body>
<div class="box split" id="split">
  <h1>Split PDF</h1>
  <input type="file" id="splitFile" accept="application/pdf"><br>
  <label><input type="radio" name="mode" value="all" checked> Every page as its own file</label>
  <label><input type="radio" name="mode" value="range"> Specific pages (e.g. 1-3, 5, 8-10)</label>
  <input type="text" id="ranges" placeholder="1-3, 5, 8-10"><br>
  <button onclick="splitPdf()">Split PDF</button>
  <p id="s1"></p>
</div>
<div class="box comp" id="compress">
  <h1>Compress PDF</h1>
  <input type="file" id="compFile" accept="application/pdf"><br>
  <select id="level">
    <option value="1.5,0.7">Light compression (better quality)</option>
    <option value="1.2,0.55" selected>Medium (recommended)</option>
    <option value="0.9,0.4">Heavy compression (smallest file)</option>
  </select><br>
  <button onclick="compressPdf()">Compress PDF</button>
  <p id="s2"></p>
</div>
<script>
const { PDFDocument } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "vendor/pdf.worker.min.js";
function download(bytes, name){
  DPLResult.file(new Blob([bytes], {type: "application/pdf"}), name);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const kb = n => (n / 1024 / 1024).toFixed(2) + " MB";
function parseRanges(text, total){
  const groups = [];
  text.split(",").forEach(part => {
    part = part.trim(); if(!part) return;
    let [a, b] = part.split("-").map(x => parseInt(x));
    if(isNaN(b)) b = a;
    a = Math.max(1, a); b = Math.min(total, b);
    if(a <= b){
      const g = []; for(let i = a; i <= b; i++) g.push(i - 1);
      groups.push({name: a === b ? "page-" + a : "pages-" + a + "-" + b, pages: g});
    }
  });
  return groups;
}
async function splitPdf(){
  const f = document.getElementById("splitFile").files[0];
  const s = document.getElementById("s1");
  if(!f){ alert(T("Choose a PDF first")); return; }
  s.textContent = "Working...";
  const src = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption: true});
  const total = src.getPageCount();
  const mode = document.querySelector("input[name=mode]:checked").value;
  let groups;
  if(mode === "all"){
    groups = src.getPageIndices().map(i => ({name: "page-" + (i+1), pages: [i]}));
  }else{
    groups = parseRanges(document.getElementById("ranges").value, total);
    if(!groups.length){ s.textContent = "Enter valid page numbers (total pages " + total + ")"; return; }
  }
  const made = [];
  for(const g of groups){
    const out = await PDFDocument.create();
    (await out.copyPages(src, g.pages)).forEach(p => out.addPage(p));
    made.push({blob: new Blob([await out.save()], {type: "application/pdf"}), name: g.name + ".pdf"});
  }
  s.textContent = "Done! " + groups.length + " files created.";
  DPLResult.files(made);
}
async function compressPdf(){
  const f = document.getElementById("compFile").files[0];
  const s = document.getElementById("s2");
  if(!f){ alert(T("Choose a PDF first")); return; }
  const [scale, quality] = document.getElementById("level").value.split(",").map(Number);
  const src = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const out = await PDFDocument.create();
  for(let i = 1; i <= src.numPages; i++){
    s.textContent = "Page " + i + " / " + src.numPages + " ...";
    const page = await src.getPage(i);
    const orig = page.getViewport({scale: 1});
    const vp = page.getViewport({scale});
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    const jpg = await (await fetch(c.toDataURL("image/jpeg", quality))).arrayBuffer();
    const img = await out.embedJpg(jpg);
    const p = out.addPage([orig.width, orig.height]);
    p.drawImage(img, {x: 0, y: 0, width: orig.width, height: orig.height});
  }
  const bytes = await out.save();
  if(bytes.length >= f.size){
    s.textContent = "This file could not be made smaller (already compressed). Try another level.";
    return;
  }
  download(bytes, f.name.replace(/\.pdf$/i, "") + "-compressed.pdf");
  s.textContent = "Done! " + kb(f.size) + " \u2192 " + kb(bytes.length);
}
</script>
<script src="nav.js"></script>
</body>
</html>
