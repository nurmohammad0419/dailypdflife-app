<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPdfLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Fill PDF forms</title>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="app-shell.js"></script>
<script src="result.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<style>
  .lay{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px;align-items:start}
  .fields{display:flex;flex-direction:column;gap:12px;max-height:68vh;overflow:auto;padding-right:4px}
  .fld label{display:block;font-size:13px;font-weight:650;color:var(--ink);margin-bottom:5px}
  .fld .k{font-size:11px;color:var(--ink-3);font-weight:600;margin-left:6px;text-transform:uppercase;letter-spacing:.5px}
  .fld input[type=text],.fld select,.fld textarea{width:100%}
  .fld.check label{display:flex;gap:8px;align-items:center;font-weight:600}
  .fld.radio .opts{display:flex;flex-wrap:wrap;gap:12px}
  .fld.radio .opts label{display:flex;gap:6px;align-items:center;font-weight:500;margin:0}
  .fld.on{outline:2px solid #1c7ed6;outline-offset:6px;border-radius:6px}
  .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .pri{background:#2e9d4a;color:#fff;border:0}
  .prev{display:flex;flex-direction:column;align-items:center;gap:14px;max-height:78vh;overflow:auto;background:#eef1f7;
        border-radius:12px;padding:14px}
  .pw{position:relative;box-shadow:0 2px 10px rgba(20,25,40,.15);background:#fff}
  .pw canvas{display:block;max-width:100%}
  .hot{position:absolute;border:1.5px solid rgba(28,126,214,.55);background:rgba(28,126,214,.08);border-radius:2px;cursor:pointer}
  .hot:hover,.hot.on{background:rgba(28,126,214,.22);border-color:#1c7ed6}
  .empty{color:var(--ink-3);padding:20px 0}
  @media(max-width:980px){.lay{grid-template-columns:1fr}.fields{max-height:none}}
</style>
</head>
<body>
<div class="box">
  <h3>1. Choose a PDF form</h3>
  <input type="file" id="file" accept="application/pdf">
  <p class="note" id="info">Works with PDFs that have fillable boxes (AcroForm). Click a box on the page to jump to it.</p>
</div>

<div class="lay" id="lay" style="display:none">
  <div class="box">
    <h3>2. Fill in the fields</h3>
    <div class="fields" id="fields"></div>
    <div class="acts">
      <label><input type="checkbox" id="flat"> Lock the answers (flatten)</label>
      <span style="flex:1"></span>
      <button id="clear">Clear all</button>
      <button class="pri" id="save">💾 Save PDF</button>
    </div>
  </div>
  <div class="box">
    <h3>Preview</h3>
    <div class="prev" id="prev"></div>
  </div>
</div>

<script src="nav.js"></script>
<script src="install.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "vendor/pdf.worker.min.js";
const { PDFDocument, PDFTextField, PDFCheckBox, PDFDropdown, PDFRadioGroup, PDFOptionList } = PDFLib;
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
let bytes = null, fileName = "form", list = [];   /* {name, kind, el, options} */

const nice = n => n.replace(/[_\.]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\s+/g, " ").trim().replace(/^./, c => c.toUpperCase());
const LATIN = /^[\u0009\u000A\u000D -~ -ÿ–—‘’“”•€]*$/;

$("file").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  fileName = f.name.replace(/\.pdf$/i, "");
  bytes = await f.arrayBuffer();
  let doc;
  try{ doc = await PDFDocument.load(bytes.slice(0)); }
  catch(err){ alert(TT("This PDF could not be opened. It may be password-protected.")); return; }
  const form = doc.getForm();
  const flds = form.getFields();
  const box = $("fields"); box.innerHTML = ""; list = [];
  flds.forEach(fd => {
    const name = fd.getName();
    let kind = null, el = document.createElement("div"), opts = null;
    el.className = "fld";
    const head = '<label>' + nice(name).replace(/</g, "&lt;") + '<span class="k"></span></label>';
    if(fd instanceof PDFTextField){
      kind = "text";
      const multi = fd.isMultiline();
      el.innerHTML = head + (multi ? '<textarea rows="3"></textarea>' : '<input type="text">');
      const inp = el.querySelector("input,textarea");
      inp.value = fd.getText() || "";
      const max = fd.getMaxLength(); if(max) inp.maxLength = max;
      el.querySelector(".k").textContent = TT("text");
    }else if(fd instanceof PDFCheckBox){
      kind = "check"; el.className += " check";
      el.innerHTML = '<label><input type="checkbox"> ' + nice(name).replace(/</g, "&lt;") + "</label>";
      el.querySelector("input").checked = fd.isChecked();
    }else if(fd instanceof PDFDropdown || fd instanceof PDFOptionList){
      kind = "select"; opts = fd.getOptions();
      el.innerHTML = head + "<select><option value=''>—</option></select>";
      const sel = el.querySelector("select");
      opts.forEach(o => { const op = document.createElement("option"); op.value = o; op.textContent = o; sel.appendChild(op); });
      sel.value = (fd.getSelected() || [])[0] || "";
      el.querySelector(".k").textContent = TT("choice");
    }else if(fd instanceof PDFRadioGroup){
      kind = "radio"; opts = fd.getOptions(); el.className += " radio";
      const gname = "r" + list.length;
      el.innerHTML = head + '<div class="opts">' + opts.map(o =>
        '<label><input type="radio" name="' + gname + '" value="' + String(o).replace(/"/g, "&quot;") + '"> ' + String(o).replace(/</g, "&lt;") + "</label>").join("") + "</div>";
      const cur = fd.getSelected();
      el.querySelectorAll("input").forEach(r => r.checked = r.value === cur);
      el.querySelector(".k").textContent = TT("option");
    }
    if(!kind) return;
    box.appendChild(el);
    list.push({name: name, kind: kind, el: el, options: opts});
  });
  $("lay").style.display = "";
  if(!list.length){
    box.innerHTML = '<p class="empty">' + TT("This PDF has no fillable fields. Use the PDF editor to type on it instead.") +
                    ' <a href="pdf-editor.html">' + TT("Open the PDF editor") + "</a></p>";
  }
  $("info").textContent = list.length ? list.length + " " + TT("fields found. Click a box on the page to jump to it.") : "";
  await preview(doc);
};

async function preview(doc){
  const prev = $("prev"); prev.innerHTML = "";
  const js = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;
  const width = Math.min(760, prev.clientWidth - 28 || 600);
  for(let i = 1; i <= js.numPages; i++){
    const page = await js.getPage(i);
    const v1 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: width / v1.width});
    const wrap = document.createElement("div"); wrap.className = "pw";
    const c = document.createElement("canvas");
    c.width = Math.floor(vp.width * 1.5); c.height = Math.floor(vp.height * 1.5);
    c.style.width = Math.floor(vp.width) + "px";
    await page.render({canvasContext: c.getContext("2d"), viewport: page.getViewport({scale: vp.scale * 1.5})}).promise;
    wrap.appendChild(c); prev.appendChild(wrap);
    const ann = await page.getAnnotations();
    ann.filter(a => a.fieldName).forEach(a => {
      const r = vp.convertToViewportRectangle(a.rect);
      const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]);
      const hot = document.createElement("div");
      hot.className = "hot";
      hot.style.left = x + "px"; hot.style.top = y + "px";
      hot.style.width = Math.abs(r[2] - r[0]) + "px"; hot.style.height = Math.abs(r[3] - r[1]) + "px";
      hot.title = nice(a.fieldName);
      hot.onclick = () => focus(a.fieldName);
      wrap.appendChild(hot);
    });
  }
}
function focus(name){
  const it = list.find(x => x.name === name); if(!it) return;
  list.forEach(x => x.el.classList.remove("on"));
  it.el.classList.add("on");
  it.el.scrollIntoView({behavior: "smooth", block: "center"});
  const inp = it.el.querySelector("input,select,textarea"); if(inp) inp.focus({preventScroll: true});
}

$("clear").onclick = () => list.forEach(it => {
  it.el.querySelectorAll("input[type=text],textarea").forEach(x => x.value = "");
  it.el.querySelectorAll("input[type=checkbox],input[type=radio]").forEach(x => x.checked = false);
  it.el.querySelectorAll("select").forEach(x => x.value = "");
});

$("save").onclick = async () => {
  if(!bytes){ alert(TT("Choose a PDF first")); return; }
  for(const it of list){
    const t = it.el.querySelector("input[type=text],textarea");
    if(t && !LATIN.test(t.value)){
      alert(TT("Form boxes can only hold English (Latin) letters. Please use the PDF editor for Bangla or Arabic text.") + "\n\n" + nice(it.name));
      t.focus(); return;
    }
  }
  const btn = $("save"), old = btn.textContent; btn.disabled = true; btn.textContent = TT("Saving...");
  try{
    const doc = await PDFDocument.load(bytes.slice(0));
    const form = doc.getForm();
    for(const it of list){
      if(it.kind === "text"){
        const v = it.el.querySelector("input,textarea").value;
        form.getTextField(it.name).setText(v || undefined);
      }else if(it.kind === "check"){
        const cb = form.getCheckBox(it.name);
        it.el.querySelector("input").checked ? cb.check() : cb.uncheck();
      }else if(it.kind === "select"){
        const v = it.el.querySelector("select").value;
        const fd = form.getField(it.name);
        if(v) fd.select(v); else if(fd.clear) fd.clear();
      }else if(it.kind === "radio"){
        const r = it.el.querySelector("input:checked");
        const fd = form.getRadioGroup(it.name);
        if(r) fd.select(r.value); else fd.clear();
      }
    }
    if($("flat").checked) form.flatten();
    DPLResult.file(new Blob([await doc.save()], {type: "application/pdf"}), fileName + "-filled.pdf");
  }catch(err){
    alert(TT("Sorry, this PDF could not be saved. It may be password-protected."));
  }
  btn.disabled = false; btn.textContent = old;
};
</script>
</body>
</html>
