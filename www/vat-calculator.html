<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPdfLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>VAT calculator</title>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="app-shell.js"></script>
<script src="result.js"></script>
<style>
  .lay{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px;align-items:start}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{border:0 !important;border-radius:0 !important;padding:11px !important;background:#fff}
  .seg button.on{background:#1b2030;color:#fff}
  .amt{display:flex;gap:8px}
  .amt input{flex:1 1 auto;min-width:0;width:auto !important;font-size:22px !important;font-weight:700;padding:12px 14px !important}
  .amt select{flex:0 0 100px;width:100px !important}
  .rates{display:flex;flex-wrap:wrap;gap:6px}
  .rates button{padding:7px 11px !important;font-size:13px !important}
  .rates button.on{background:#0b7285;color:#fff;border-color:#0b7285}
  .rates input{width:90px}
  .out{display:grid;gap:12px}
  .card{border-radius:14px;padding:18px 20px;border:1px solid var(--line);background:#fff}
  .card small{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .card b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.4px;color:var(--ink)}
  .card.tot{background:linear-gradient(135deg,#0b7285,#095c6b);border:0}
  .card.tot small{color:rgba(255,255,255,.75)} .card.tot b{color:#fff;font-size:32px}
  .card.vat b{color:#0b7285}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  @media(max-width:900px){.lay{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="lay">
  <div class="box">
    <h3>Calculation</h3>
    <div class="seg" id="mode">
      <button data-m="add" class="on">＋ Add VAT</button>
      <button data-m="remove">− Remove VAT</button>
    </div>
    <p class="note" id="modeHint" style="margin:8px 0 0"></p>
    <h3>Amount</h3>
    <div class="amt">
      <input type="number" id="amount" inputmode="decimal" placeholder="0.00" value="1000" min="0" step="0.01">
      <select id="cur"><option>SAR</option><option>AED</option><option>BHD</option><option>OMR</option><option>BDT</option><option>USD</option><option>EUR</option></select>
    </div>
    <h3>VAT rate</h3>
    <div class="rates" id="rates">
      <button data-r="15" data-c="SAR" class="on">🇸🇦 15%</button>
      <button data-r="5" data-c="AED">🇦🇪 5%</button>
      <button data-r="10" data-c="BHD">🇧🇭 10%</button>
      <button data-r="5" data-c="OMR">🇴🇲 5%</button>
      <button data-r="15" data-c="BDT">🇧🇩 15%</button>
      <input type="number" id="rate" value="15" min="0" max="100" step="0.01" title="Custom rate %">
    </div>
  </div>
  <div class="box">
    <h3>Result</h3>
    <div class="out">
      <div class="card"><small>Amount before VAT</small><b id="net"></b></div>
      <div class="card vat"><small id="vatL">VAT</small><b id="vat"></b></div>
      <div class="card tot"><small>Total with VAT</small><b id="tot"></b></div>
      <div class="acts">
        <button id="copy">📋 Copy summary</button>
      </div>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script src="install.js"></script>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
let mode = "add";
const dec = c => (c === "BHD" || c === "OMR") ? 3 : 2;
const fmt = (n, c) => c + " " + n.toLocaleString("en-US", {minimumFractionDigits: dec(c), maximumFractionDigits: dec(c)});

function calc(){
  const a = Math.max(0, Number($("amount").value) || 0), r = Math.max(0, Number($("rate").value) || 0), c = $("cur").value;
  let net, vat, tot;
  if(mode === "add"){ net = a; vat = a * r / 100; tot = a + vat; }
  else { tot = a; net = a / (1 + r / 100); vat = tot - net; }
  $("net").textContent = fmt(net, c); $("vat").textContent = fmt(vat, c); $("tot").textContent = fmt(tot, c);
  $("vatL").textContent = TT("VAT") + " (" + r + "%)";
  $("modeHint").textContent = mode === "add" ? TT("The amount you enter does not include VAT yet.")
                                             : TT("The amount you enter already includes VAT.");
  document.querySelectorAll("#rates button").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r && b.dataset.c === c));
  return {net, vat, tot, r, c};
}
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b)); calc();
});
document.querySelectorAll("#rates button").forEach(b => b.onclick = () => { $("rate").value = b.dataset.r; $("cur").value = b.dataset.c; calc(); });
["amount", "rate", "cur"].forEach(id => $(id).oninput = calc);
$("copy").onclick = () => {
  const x = calc();
  const t = TT("Amount before VAT") + ": " + fmt(x.net, x.c) + "\n" + TT("VAT") + " (" + x.r + "%): " + fmt(x.vat, x.c) + "\n" + TT("Total with VAT") + ": " + fmt(x.tot, x.c);
  try{ navigator.clipboard.writeText(t); $("copy").textContent = "✓ " + TT("Copied"); setTimeout(() => $("copy").textContent = "📋 " + TT("Copy summary"), 1500); }catch(e){}
};
calc();
</script>
</body>
</html>
