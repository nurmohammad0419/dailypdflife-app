name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle   # keep downloaded Gradle libraries between builds, so a busy Maven server can't break the build

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prepare the website for the app
        run: python3 scripts/build_www.py site

      - name: Copy web files into the Android project
        run: npx cap sync android

      - name: Unlock the Google Play upload key
        # android/upload.keystore.enc is encrypted; it can only be opened with the RELEASE_SECRET repository secret.
        # Without the secret the app is still built, signed with the test key, for direct installs.
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          if [ -n "$RELEASE_SECRET" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in android/upload.keystore.enc -out "$RUNNER_TEMP/upload.keystore" -pass env:RELEASE_SECRET
            {
              echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_SECRET"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_SECRET"
              echo "RELEASE_KEY_ALIAS=upload"
              echo "PLAY_BUILD=1"
            } >> "$GITHUB_ENV"
            echo "Signing with the Google Play upload key"
          else
            echo "RELEASE_SECRET is not set: signing with the test key"
          fi

      - name: Build APK (and the Play Store bundle when the upload key is available)
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          TASKS="assembleRelease"
          if [ -n "$PLAY_BUILD" ]; then TASKS="assembleRelease bundleRelease"; fi
          ./gradlew $TASKS --no-daemon --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DailyPdfLife.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist/DailyPdfLife-play.aab
          fi
          ls -la dist

      - name: Publish the APK as the "latest" release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/DailyPdfLife.apk $(ls dist/DailyPdfLife-play.aab 2>/dev/null) \
            --title "DailyPdfLife app (build ${{ github.run_number }})" \
            --notes "Download DailyPdfLife.apk on your Android phone and open it to install."

      - name: Save APK and build log to the 'build-output' branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          cp dist/DailyPdfLife.apk /tmp/out/ 2>/dev/null || true
          cp dist/DailyPdfLife-play.aab /tmp/out/ 2>/dev/null || true
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
