name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prepare the website for the app
        run: python3 scripts/build_www.py site

      - name: Copy web files into the Android project
        run: npx cap sync android

      - name: Build APK
        id: gradle
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DailyPdfLife.apk
          ls -la dist

      - name: Publish the APK as the "latest" release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/DailyPdfLife.apk \
            --title "DailyPdfLife app (build ${{ github.run_number }})" \
            --notes "Download DailyPdfLife.apk on your Android phone and open it to install."

      - name: Save APK and build log to the 'build-output' branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no log" > /tmp/out/build.log
          cp dist/DailyPdfLife.apk /tmp/out/ 2>/dev/null || true
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
