<style>
  .lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px;align-items:start}
  .seg{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:#f1f3f7;border-radius:999px;padding:4px;margin-bottom:6px}
  .seg button{border:0 !important;background:transparent;padding:8px 20px !important;border-radius:999px !important}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .f{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f2f3f6}
  .f:last-child{border-bottom:0}
  .f label{font-size:14px;font-weight:600;color:var(--ink)}
  .f label small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .f input,.f select{width:100%}
  .res{position:sticky;top:80px}
  .card{border-radius:18px;padding:18px 20px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
  .card small{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .card b{display:block;font-size:22px;margin-top:4px}
  .card.big{background:linear-gradient(135deg,#0ca678,#087f5b);border:0}
  .card.big small{color:rgba(255,255,255,.8)} .card.big b{color:#fff;font-size:32px}
  .rows{font-size:14px;color:var(--ink-2)}
  .rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #eceef2}
  .rows div:last-child{border:0}
  @media(max-width:900px){.lay{grid-template-columns:1fr}.res{position:static}.f{grid-template-columns:1fr 160px}}
</style>
<div class="lay">
  <div class="box">
    <div class="seg" id="ctry"><button data-c="sa" class="on">🇸🇦 Saudi Arabia</button><button data-c="ae">🇦🇪 UAE</button></div>
    <div class="f"><label>First day of work</label><input type="date" id="d1"></div>
    <div class="f"><label>Last day of work</label><input type="date" id="d2"></div>
    <div class="f"><label id="wl">Last monthly wage<small id="ws">Basic + housing + other fixed allowances</small></label><input type="number" id="wage" min="0" placeholder="e.g. 6000"></div>
    <div class="f"><label>Currency</label><select id="cur"><option>SAR</option><option>AED</option></select></div>
    <div class="f"><label>Unpaid leave days<small>Days of unpaid absence during the job, if any</small></label><input type="number" id="unpaid" min="0" value="0"></div>
    <div class="f" id="whyRow"><label>How did the job end?</label>
      <select id="why"><option value="end">Contract ended or employer ended it</option><option value="resign">I resigned</option><option value="force">Left for a reason the law protects (e.g. Article 81, force majeure)</option></select></div>
  </div>
  <div class="res">
    <div class="card big"><small>End-of-service benefit</small><b id="total">—</b></div>
    <div class="card"><small>Time served</small><b id="served">—</b></div>
    <div class="card rows" id="rows"></div>
    <p class="note" id="rule"></p>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
let ctry = "sa";
const money = n => $("cur").value + " " + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
function span(a, b){ /* years as a decimal, counting the last day */
  const days = (b - a) / 864e5 + 1 - (Number($("unpaid").value) || 0); return Math.max(0, days) / 365; }
function ymd(y){ const Y = Math.floor(y), m = (y - Y) * 12, M = Math.floor(m), D = Math.round((m - M) * 30.4167); return `${Y} ${TT("years")}, ${M} ${TT("months")}, ${D} ${TT("days")}`; }
function calc(){
  const a = new Date($("d1").value), b = new Date($("d2").value), w = Number($("wage").value) || 0, rows = [];
  if(isNaN(a) || isNaN(b) || b < a || !w){ $("total").textContent = "—"; $("served").textContent = "—"; $("rows").innerHTML = "<div>" + TT("Fill in the dates and the wage.") + "</div>"; return; }
  const y = span(a, b); $("served").textContent = ymd(y);
  let total = 0;
  if(ctry === "sa"){
    const first = Math.min(5, y) * w / 2, after = Math.max(0, y - 5) * w; let full = first + after;
    rows.push([TT("First 5 years × half a month"), money(first)], [TT("After 5 years × one month"), money(after)], [TT("Full award"), money(full)]);
    const why = $("why").value; let f = 1, note = "";
    if(why === "resign"){ f = y < 2 ? 0 : y < 5 ? 1/3 : y < 10 ? 2/3 : 1; note = y < 2 ? TT("Under 2 years: no award on resignation") : y < 5 ? TT("2 to 5 years: one third") : y < 10 ? TT("5 to 10 years: two thirds") : TT("10 years or more: full award"); rows.push([TT("Resignation share"), note]); }
    total = full * f;
    $("rule").textContent = TT("Saudi Labour Law, Articles 84 and 85: half a month's wage for each of the first five years and a full month for each year after, based on the last wage. On resignation, the share depends on the years served. Article 80 dismissals get no award. Check your case with HRSD or a lawyer.");
  } else {
    const daily = w / 30;
    if(y < 1){ total = 0; rows.push([TT("Less than one year of service"), TT("No gratuity")]); }
    else { const first = Math.min(5, y) * 21 * daily, after = Math.max(0, y - 5) * 30 * daily; total = Math.min(first + after, w * 24);
      rows.push([TT("Daily basic wage (÷30)"), money(daily)], [TT("First 5 years × 21 days"), money(first)], [TT("After 5 years × 30 days"), money(after)]);
      if(first + after > w * 24) rows.push([TT("Capped at 2 years' wage"), money(w * 24)]); }
    $("rule").textContent = TT("UAE Labour Law (Decree-Law 33 of 2021), Article 51: 21 days of basic wage for each of the first five years and 30 days for each year after, for full-time staff with at least one year of service, capped at two years' wage. Resigning does not reduce it under the current law. Check your case with MOHRE.");
  }
  $("total").textContent = money(total);
  $("rows").innerHTML = rows.map(r => `<div><span>${r[0]}</span><b style="font-size:14px;margin:0">${r[1]}</b></div>`).join("");
}
$("ctry").querySelectorAll("button").forEach(b => b.onclick = () => { ctry = b.dataset.c; $("ctry").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  $("cur").value = ctry === "sa" ? "SAR" : "AED"; $("whyRow").hidden = ctry !== "sa";
  $("ws").textContent = TT(ctry === "sa" ? "Basic + housing + other fixed allowances" : "Basic salary only, as in your contract"); calc(); });
["d1", "d2", "wage", "cur", "unpaid", "why"].forEach(id => $(id).addEventListener("input", calc));
$("d2").valueAsDate = new Date(); calc();
</script>
