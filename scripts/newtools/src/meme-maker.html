<style>
  @import url("https://fonts.googleapis.com/css2?family=Anton&display=swap");
  .lay{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
  .side{position:sticky;top:80px}
  .styles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .styles button{padding:10px 6px !important;font-size:13px}
  .styles button.on{background:#111827;color:#fff;border-color:#111827}
  .side textarea{width:100%;min-height:58px;font-size:16px;resize:vertical}
  .side label{display:block;font-size:13px;font-weight:650;color:var(--ink);margin:10px 0 5px}
  .row{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px}
  .row input[type=range]{flex:1}
  .pri{width:100%;background:#f59f00;color:#111;border:0;padding:12px !important;margin-top:14px;font-size:15px}
  .stage{background:#eef0f4;border-radius:14px;padding:14px;display:flex;justify-content:center}
  #cv{max-width:100%;max-height:74vh;box-shadow:0 3px 14px rgba(20,25,40,.18)}
  .blank{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
  @media(max-width:900px){.lay{grid-template-columns:1fr}.side{position:static}}
</style>
<div class="box">
  <input type="file" id="file" accept="image/*">
  <div class="blank">or start with a plain background <input type="color" id="bg" value="#111827"> <button id="useBg">Use colour</button></div>
</div>
<div class="lay" id="lay" hidden>
  <div class="box side">
    <h3>Style</h3>
    <div class="styles" id="styles"><button data-s="classic" class="on">Classic (text on photo)</button><button data-s="caption">Caption bar on top</button></div>
    <label id="l1">Top text</label><textarea id="t1" dir="auto"></textarea>
    <label id="l2">Bottom text</label><textarea id="t2" dir="auto"></textarea>
    <div class="row">Size <input type="range" id="size" min="5" max="16" value="10" step="0.5"></div>
    <div class="row">Colour <input type="color" id="col" value="#ffffff"><span style="flex:1"></span><label style="margin:0;font-weight:500"><input type="checkbox" id="caps" checked> CAPITALS</label></div>
    <button class="pri" id="save">⬇ Save meme</button>
  </div>
  <div class="box"><div class="stage"><canvas id="cv"></canvas></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
let img = null, style = "classic", name = "meme";
const FONT = "Anton, Impact, 'Arial Black', 'Noto Sans Bengali', sans-serif";
function wrap(g, text, maxW){
  const out = []; text.split("\n").forEach(par => { let line = ""; par.split(" ").forEach(w => { const t = line ? line + " " + w : w;
    if(g.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; }); out.push(line); }); return out.filter((l, i, a) => l || a.length === 1);
}
function render(c, W){
  const g = c.getContext("2d"), H0 = img ? Math.round(W * img.naturalHeight / img.naturalWidth) : Math.round(W * 0.8);
  const up = v => $("caps").checked ? v.toUpperCase() : v, t1 = up($("t1").value.trim()), t2 = up($("t2").value.trim());
  if(style === "caption"){
    const fs = W * Number($("size").value) / 180, pad = fs * 0.9;
    g.font = `600 ${fs}px Arial, "Segoe UI", "Noto Sans Bengali", sans-serif`; const lines = t1 ? wrap(g, t1, W - pad * 2) : [];
    const barH = lines.length ? lines.length * fs * 1.3 + pad * 2 : 0;
    c.width = W; c.height = H0 + barH; g.fillStyle = "#fff"; g.fillRect(0, 0, W, barH);
    if(img) g.drawImage(img, 0, barH, W, H0); else { g.fillStyle = $("bg").value; g.fillRect(0, barH, W, H0); }
    g.font = `600 ${fs}px Arial, "Segoe UI", "Noto Sans Bengali", sans-serif`; g.fillStyle = "#111"; g.textBaseline = "top";
    lines.forEach((l, i) => g.fillText(l, pad, pad + i * fs * 1.3));
    return;
  }
  c.width = W; c.height = H0;
  if(img) g.drawImage(img, 0, 0, W, H0); else { g.fillStyle = $("bg").value; g.fillRect(0, 0, W, H0); }
  const fs = W * Number($("size").value) / 100; g.font = `${fs}px ${FONT}`; g.textAlign = "center"; g.lineJoin = "round";
  g.lineWidth = fs * 0.16; g.strokeStyle = "#000"; g.fillStyle = $("col").value;
  const put = (lines, top) => lines.forEach((l, i) => { const y = top ? fs * 0.25 + fs * 1.05 * (i + 1) - fs * 0.15 : H0 - fs * 0.3 - fs * 1.05 * (lines.length - 1 - i);
    g.strokeText(l, W / 2, y); g.fillText(l, W / 2, y); });
  if(t1) put(wrap(g, t1, W * 0.94), true); if(t2) put(wrap(g, t2, W * 0.94), false);
}
function preview(){ render($("cv"), 900); }
function start(){ $("lay").hidden = false; if(!$("t1").value) $("t1").value = TT("When the PDF finally"); if(!$("t2").value) $("t2").value = TT("fits under 1 MB"); preview(); }
$("file").onchange = e => { const f = e.target.files[0]; if(!f) return; name = f.name.replace(/\.[^.]+$/, "");
  const im = new Image(); im.onload = () => { img = im; start(); }; im.src = URL.createObjectURL(f); };
$("useBg").onclick = () => { img = null; start(); };
["t1", "t2", "size", "col", "caps", "bg"].forEach(id => $(id).addEventListener("input", preview));
$("styles").querySelectorAll("button").forEach(b => b.onclick = () => { style = b.dataset.s; $("styles").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  $("l1").textContent = TT(style === "caption" ? "Caption" : "Top text"); $("l2").hidden = $("t2").hidden = style === "caption"; preview(); });
document.fonts && document.fonts.load("40px Anton").then(preview).catch(() => {});
$("save").onclick = () => { const c = document.createElement("canvas"); render(c, img ? Math.min(2000, img.naturalWidth) : 1200);
  c.toBlob(b => DPLResult.file(b, name + "-meme.jpg"), "image/jpeg", 0.92); };
</script>
