<!-- libs: pdfjs -->
<style>
  .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
  .opts label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--ink)}
  .pri{background:#f59f00;color:#fff;border:0;padding:13px 26px !important;font-size:15px;margin-top:16px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px}
  .thumbs figure{margin:0;background:repeating-conic-gradient(#f3f4f6 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
  .thumbs img{max-width:100%;max-height:200px;display:block;margin:0 auto 6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .thumbs figcaption{font-size:12.5px;color:var(--ink-3)}
</style>
<div class="box">
  <h3>1. Choose a PDF</h3>
  <input type="file" id="file" accept="application/pdf">
  <h3>2. Options</h3>
  <div class="opts">
    <label>Format <select id="fmt"><option value="png">PNG (sharp, lossless)</option><option value="webp">WEBP (small)</option><option value="jpg">JPG</option></select></label>
    <label>Resolution <select id="dpi"><option value="1">Screen (72 dpi)</option><option value="2" selected>High (144 dpi)</option><option value="4.17">Print (300 dpi)</option></select></label>
    <label>Pages <input id="range" placeholder="All, or e.g. 1-3, 5" style="width:180px"></label>
    <label style="flex-direction:row;align-items:center;gap:8px;padding-bottom:10px"><input type="checkbox" id="transp"> Transparent background (PNG)</label>
  </div>
  <button class="pri" id="go">🖼 Convert to images</button>
  <p class="note" id="status"></p>
  <div class="thumbs" id="thumbs"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
function pick(str, n){
  if(!str.trim()) return [...Array(n)].map((_, i) => i + 1);
  const s = new Set();
  str.split(",").forEach(p => { const m = p.trim().match(/^(\d+)\s*(?:-\s*(\d+))?$/); if(!m) return;
    for(let i = +m[1]; i <= +(m[2] || m[1]); i++) if(i >= 1 && i <= n) s.add(i); });
  return [...s].sort((a, b) => a - b);
}
$("go").onclick = async () => {
  const f = $("file").files[0]; if(!f) return alert(TT("Choose a PDF first"));
  const fmt = $("fmt").value, mime = {png: "image/png", webp: "image/webp", jpg: "image/jpeg"}[fmt], scale = Number($("dpi").value);
  const base = f.name.replace(/\.pdf$/i, ""), list = []; $("thumbs").innerHTML = "";
  let pdf; try{ pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise; }
  catch(e){ return alert(TT("This PDF could not be opened. If it has a password, unlock it first.")); }
  const nums = pick($("range").value, pdf.numPages); if(!nums.length) return alert(TT("No pages match that range."));
  for(const i of nums){
    $("status").textContent = TT("Page") + " " + i + " / " + pdf.numPages;
    const page = await pdf.getPage(i), vp = page.getViewport({scale});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; const g = c.getContext("2d");
    if(!(fmt === "png" && $("transp").checked)){ g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); }
    await page.render({canvasContext: g, viewport: vp, background: (fmt === "png" && $("transp").checked) ? "rgba(0,0,0,0)" : undefined}).promise;
    const blob = await new Promise(r => c.toBlob(r, mime, 0.92)), name = base + "-page-" + i + "." + fmt;
    list.push({blob, name});
    const fig = document.createElement("figure"); fig.innerHTML = "<img><figcaption></figcaption>";
    fig.querySelector("img").src = URL.createObjectURL(blob); fig.querySelector("figcaption").textContent = name + " · " + Math.round(blob.size / 1024) + " KB";
    $("thumbs").appendChild(fig);
  }
  $("status").textContent = "";
  DPLResult.files(list, list.length + " " + TT("images ready"));
};
</script>
