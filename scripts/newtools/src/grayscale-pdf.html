<!-- libs: pdfjs pdflib -->
<style>
  .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
  .opts label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--ink)}
  .pri{background:#495057;color:#fff;border:0;padding:13px 26px !important;font-size:15px;margin-top:16px}
  .prev{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
  .prev img{width:150px;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
</style>
<div class="box">
  <h3>1. Choose a PDF</h3>
  <input type="file" id="file" accept="application/pdf">
  <h3>2. Options</h3>
  <div class="opts">
    <label>Look <select id="look"><option value="gray">Grayscale</option><option value="bw">Black &amp; white (crisp text)</option></select></label>
    <label>Quality <select id="q"><option value="1.6">Normal (smaller file)</option><option value="2.2" selected>High</option><option value="3">Print</option></select></label>
  </div>
  <button class="pri" id="go">◐ Make it grayscale</button>
  <p class="note" id="status"></p>
  <div class="prev" id="prev"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
$("go").onclick = async () => {
  const f = $("file").files[0]; if(!f) return alert(TT("Choose a PDF first"));
  const scale = Number($("q").value), bw = $("look").value === "bw"; $("prev").innerHTML = "";
  let pdf; try{ pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise; }
  catch(e){ return alert(TT("This PDF could not be opened. If it has a password, unlock it first.")); }
  const out = await PDFLib.PDFDocument.create();
  for(let i = 1; i <= pdf.numPages; i++){
    $("status").textContent = TT("Page") + " " + i + " / " + pdf.numPages;
    const page = await pdf.getPage(i), v1 = page.getViewport({scale: 1}), vp = page.getViewport({scale});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: g, viewport: vp}).promise;
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
    for(let k = 0; k < a.length; k += 4){
      let l = 0.299 * a[k] + 0.587 * a[k+1] + 0.114 * a[k+2];
      if(bw) l = l > 165 ? 255 : l < 95 ? 0 : (l - 95) / 70 * 255;
      a[k] = a[k+1] = a[k+2] = l;
    }
    g.putImageData(d, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", bw ? 0.85 : 0.88));
    const img = await out.embedJpg(await blob.arrayBuffer()), p = out.addPage([v1.width, v1.height]);
    p.drawImage(img, {x: 0, y: 0, width: v1.width, height: v1.height});
    if(i <= 4){ const im = document.createElement("img"); im.src = URL.createObjectURL(blob); $("prev").appendChild(im); }
  }
  $("status").textContent = "";
  DPLResult.file(await out.save(), f.name.replace(/\.pdf$/i, "") + "-grayscale.pdf");
};
</script>
