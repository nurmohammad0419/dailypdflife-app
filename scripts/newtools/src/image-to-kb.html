<style>
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .presets button{padding:8px 14px !important;border-radius:999px !important;font-size:13.5px}
  .presets button.on{background:#111827;color:#fff;border-color:#111827}
  .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
  .opts label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--ink)}
  .opts input{width:120px}
  .pri{background:#1c7ed6;color:#fff;border:0;padding:13px 26px !important;font-size:15px;margin-top:16px}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .cmp figure{margin:0;background:#f7f8fa;border-radius:14px;padding:10px;text-align:center}
  .cmp img{max-width:100%;max-height:260px;border-radius:8px}
  .cmp figcaption{font-size:13.5px;color:var(--ink-2);margin-top:6px}
  .cmp b{color:var(--ink)}
  .ok{color:#1f7a3a !important}
  @media(max-width:700px){.cmp{grid-template-columns:1fr}}
</style>
<div class="box">
  <h3>1. Choose a photo</h3>
  <input type="file" id="file" accept="image/*">
  <h3>2. Target size</h3>
  <div class="presets" id="presets">
    <button data-kb="20">20 KB</button><button data-kb="50">50 KB</button><button data-kb="100" class="on">100 KB</button>
    <button data-kb="200">200 KB</button><button data-kb="300">300 KB</button><button data-kb="500">500 KB</button><button data-kb="1024">1 MB</button>
  </div>
  <div class="opts">
    <label>Or type it (KB) <input type="number" id="kb" min="5" value="100"></label>
    <label>Width (px, optional) <input type="number" id="w" min="10" placeholder="auto"></label>
    <label>Height (px, optional) <input type="number" id="h" min="10" placeholder="auto"></label>
    <label>Format <select id="fmt"><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select></label>
  </div>
  <p class="note">Many forms ask for a photo under a size, for example 50 KB, or exactly 300 × 300 pixels. Fill in the width and height only if the form asks for exact pixels.</p>
  <button class="pri" id="go">⇲ Make it this size</button>
  <p class="note" id="status"></p>
  <div class="cmp" id="cmp" hidden>
    <figure><img id="a"><figcaption id="ca"></figcaption></figure>
    <figure><img id="b"><figcaption id="cb"></figcaption></figure>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : (n / 1024).toFixed(1) + " KB";
$("presets").querySelectorAll("button").forEach(b => b.onclick = () => { $("kb").value = b.dataset.kb; $("presets").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
$("kb").oninput = () => $("presets").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.kb === $("kb").value));
function load(f){ return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(f); }); }
function draw(im, w, h){ const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.imageSmoothingQuality = "high";
  /* fill the exact box like a passport photo: crop the centre instead of stretching */
  const s = Math.max(w / im.naturalWidth, h / im.naturalHeight), dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  g.drawImage(im, (w - dw) / 2, (h - dh) / 2, dw, dh); return c; }
const blobOf = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
$("go").onclick = async () => {
  const f = $("file").files[0]; if(!f) return alert(TT("Choose a photo first"));
  const target = Math.max(5, Number($("kb").value) || 100) * 1024, type = $("fmt").value;
  let im; try{ im = await load(f); }catch(e){ return alert(TT("This image could not be opened. For iPhone HEIC photos, use HEIC to JPG first.")); }
  $("status").textContent = TT("Working…");
  const fw = Number($("w").value), fh = Number($("h").value), r = im.naturalHeight / im.naturalWidth;
  let w = fw || (fh ? Math.round(fh / r) : im.naturalWidth), h = fh || (fw ? Math.round(fw * r) : im.naturalHeight);
  const fixed = !!(fw || fh);
  let best = null;
  for(let round = 0; round < 12; round++){
    const c = draw(im, w, h); let lo = 0.05, hi = 0.95, found = null;
    for(let i = 0; i < 9; i++){ const q = (lo + hi) / 2, b = await blobOf(c, type, q); if(b.size <= target){ found = b; lo = q; } else hi = q; }
    if(!found){ const b = await blobOf(c, type, 0.05); if(b.size <= target) found = b; }
    if(found){ best = {blob: found, w, h}; break; }
    if(fixed){ best = {blob: await blobOf(c, type, 0.05), w, h, over: true}; break; }
    const small = await blobOf(c, type, 0.6), k = Math.max(0.5, Math.min(0.9, Math.sqrt(target / small.size)));
    w = Math.max(16, Math.round(w * k)); h = Math.max(16, Math.round(h * k));
  }
  $("status").textContent = "";
  if(!best) return alert(TT("Could not reach that size. Try a larger target."));
  $("a").src = URL.createObjectURL(f); $("ca").innerHTML = "<b>" + TT("Before") + "</b> · " + kb(f.size) + " · " + im.naturalWidth + "×" + im.naturalHeight;
  $("b").src = URL.createObjectURL(best.blob);
  $("cb").innerHTML = "<b class='" + (best.over ? "" : "ok") + "'>" + TT("After") + "</b> · " + kb(best.blob.size) + " · " + best.w + "×" + best.h + (best.over ? " · " + TT("smallest possible at this pixel size") : "");
  $("cmp").hidden = false;
  const ext = type === "image/webp" ? "webp" : "jpg";
  DPLResult.file(best.blob, f.name.replace(/\.[^.]+$/, "") + "-" + Math.round(best.blob.size / 1024) + "kb." + ext);
};
</script>
