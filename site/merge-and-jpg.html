<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPdfLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Merge PDF & JPG to PDF</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:30px;text-align:center}
  .box{background:#fff;max-width:700px;margin:0 auto 30px;padding:30px;border-radius:12px;box-shadow:0 2px 10px #0002}
  h1{margin-top:0}
  .merge h1{color:#e5322d} .img h1{color:#2e9d4a}
  input{margin:15px 0}
  button{color:#fff;border:none;padding:12px 30px;font-size:16px;border-radius:8px;cursor:pointer}
  .merge button{background:#e5322d} .img button{background:#2e9d4a}
  ul{text-align:left;max-width:450px;margin:auto}
</style>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="result.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3528972294042151"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="box merge" id="merge">
  <h1>Merge PDF</h1>
  <p>Pick several PDFs (hold Ctrl) — they are joined in the order you pick them.</p>
  <input type="file" id="pdfs" accept="application/pdf" multiple onchange="showFiles('pdfs','pdfList')"><br>
  <ul id="pdfList"></ul>
  <button onclick="mergePdfs()">Merge PDF</button>
  <p id="s1"></p>
</div>
<div class="box img" id="jpg">
  <h1>JPG to PDF</h1>
  <p>Pick one or more images (JPG or PNG) — each becomes a page.</p>
  <input type="file" id="imgs" accept="image/jpeg,image/png" multiple onchange="showFiles('imgs','imgList')"><br>
  <ul id="imgList"></ul>
  <button onclick="imagesToPdf()">Convert to PDF</button>
  <p id="s2"></p>
</div>
<script>
const { PDFDocument } = PDFLib;
function showFiles(inputId, listId){
  const ul = document.getElementById(listId);
  ul.innerHTML = "";
  [...document.getElementById(inputId).files].forEach(f => {
    const li = document.createElement("li"); li.textContent = f.name; ul.appendChild(li);
  });
}
function download(bytes, name){
  DPLResult.file(new Blob([bytes], {type: "application/pdf"}), name);
}
async function mergePdfs(){
  const files = [...document.getElementById("pdfs").files];
  const s = document.getElementById("s1");
  if(files.length < 2){ alert(T("Pick at least two PDFs")); return; }
  s.textContent = "Working...";
  try{
    const merged = await PDFDocument.create();
    for(const f of files){
      const src = await PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption: true});
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach(p => merged.addPage(p));
    }
    download(await merged.save(), "merged.pdf");
    s.textContent = "Done! " + files.length + " PDFs joined.";
  }catch(e){
    s.textContent = "Something went wrong: one of the PDFs may be password-protected or damaged.";
  }
}
async function imagesToPdf(){
  const files = [...document.getElementById("imgs").files];
  const s = document.getElementById("s2");
  if(!files.length){ alert(T("Choose an image first")); return; }
  s.textContent = "Working...";
  const pdf = await PDFDocument.create();
  const A4 = [595.28, 841.89], margin = 20;
  for(const f of files){
    const bytes = await f.arrayBuffer();
    const img = f.type === "image/png" ? await pdf.embedPng(bytes) : await pdf.embedJpg(bytes);
    const [pw, ph] = img.width > img.height ? [A4[1], A4[0]] : A4;
    const scale = Math.min((pw - 2*margin) / img.width, (ph - 2*margin) / img.height);
    const w = img.width * scale, h = img.height * scale;
    const page = pdf.addPage([pw, ph]);
    page.drawImage(img, {x: (pw - w)/2, y: (ph - h)/2, width: w, height: h});
  }
  download(await pdf.save(), "images.pdf");
  s.textContent = "Done! " + files.length + " images turned into a PDF.";
}
</script>
<script src="nav.js"></script>
<script src="install.js"></script>
</body>
</html>
