<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPdfLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Remove or extract PDF pages</title>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="result.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3528972294042151"
     crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  .drop{display:block;text-align:center;cursor:pointer}
  .seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{border:0 !important;border-radius:0 !important;padding:10px 18px !important;background:#fff}
  .seg button.on{background:#1b2030;color:#fff}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .bar input{flex:1;min-width:200px}
  .bar .sp{flex:1}
  .pri{background:#e5322d;color:#fff;border:0}
  .pri.ex{background:#1971c2}
  .sum{font-size:14px;font-weight:650;color:var(--ink-2);margin-top:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
  .pg{position:relative;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;cursor:pointer;user-select:none}
  .pg .th{height:150px;display:flex;align-items:center;justify-content:center}
  .pg canvas{max-width:100%;max-height:150px;box-shadow:0 1px 5px rgba(20,25,40,.18);background:#fff}
  .pg .lb{font-size:12.5px;color:var(--ink-2);margin-top:6px;font-weight:650}
  .pg .mk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #c9ced8;
          font-size:14px;line-height:20px;font-weight:800;color:#fff}
  .rm .pg.on{border-color:#e5322d;background:#fff5f5}
  .rm .pg.on canvas{opacity:.35}
  .rm .pg.on .mk{background:#e5322d;border-color:#e5322d}
  .ex .pg.on{border-color:#1971c2;background:#f1f7ff}
  .ex .pg.on .mk{background:#1971c2;border-color:#1971c2}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .quick button{padding:6px 11px !important;font-size:13px !important}
</style>
</head>
<body>
<div class="box">
  <label class="drop" id="drop">📄 Choose a PDF, or drag it here
    <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  </label>
</div>
<div class="box" id="work" style="display:none">
  <div class="bar">
    <span class="seg" id="mode"><button data-m="rm" class="on">🗑 Remove pages</button><button data-m="ex">📤 Extract pages</button></span>
    <input type="text" id="range" placeholder="Page numbers, e.g. 1, 3, 5-8">
  </div>
  <div class="quick">
    <button data-q="odd">Odd pages</button><button data-q="even">Even pages</button>
    <button data-q="first">First page</button><button data-q="last">Last page</button>
    <button data-q="none">Clear selection</button>
  </div>
  <div class="bar" style="margin-top:12px">
    <p class="sum" id="sum"></p><span class="sp"></span>
    <label id="sepL" style="display:none;font-size:13.5px;gap:6px;align-items:center"><input type="checkbox" id="sep"> Each page as its own PDF</label>
    <button class="pri" id="go">🗑 Remove &amp; save</button>
  </div>
  <div class="grid rm" id="grid"></div>
</div>

<script src="nav.js"></script>
<script src="install.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
/* small words translated here only, so they never change text elsewhere */
const BNW = {"of": "এর মধ্যে", "left": "বাকি থাকবে"};
const W = s => (window.DPL_LANG === "bn" && BNW[s] != null) ? BNW[s] : s;
let bytes = null, n = 0, sel = new Set(), mode = location.hash === "#extract" ? "ex" : "rm", fileName = "document";

function parseRange(s){
  const out = new Set();
  s.split(/[,;\s]+/).forEach(part => {
    if(!part) return;
    const m = part.match(/^(\d+)\s*[-–]\s*(\d+)?$/);
    if(m){ const a = +m[1], b = m[2] ? +m[2] : n; for(let i = Math.min(a, b); i <= Math.max(a, b); i++) if(i >= 1 && i <= n) out.add(i); }
    else if(/^\d+$/.test(part)){ const i = +part; if(i >= 1 && i <= n) out.add(i); }
  });
  return out;
}
function rangeText(set){
  const a = [...set].sort((x, y) => x - y), parts = [];
  for(let i = 0; i < a.length; i++){
    let j = i; while(j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    parts.push(j > i ? a[i] + "-" + a[j] : String(a[i])); i = j;
  }
  return parts.join(", ");
}
function sync(fromInput){
  if(!fromInput) $("range").value = rangeText(sel);
  document.querySelectorAll(".pg").forEach(d => {
    const on = sel.has(+d.dataset.p); d.classList.toggle("on", on); d.querySelector(".mk").textContent = on ? (mode === "rm" ? "✕" : "✓") : "";
  });
  const k = sel.size;
  $("sum").textContent = !k ? (mode === "rm" ? TT("Click the pages you want to remove.") : TT("Click the pages you want to keep."))
    : window.DPL_LANG === "bn"
      ? (mode === "rm" ? n + "টি পেজের মধ্যে " + k + "টি মুছে যাবে · " + (n - k) + "টি থাকবে" : n + "টি পেজের মধ্যে " + k + "টি আলাদা করা হবে")
      : mode === "rm" ? k + " of " + n + " pages will be removed · " + (n - k) + " left" : k + " of " + n + " pages will be extracted";
}
function setMode(m){
  mode = m;
  $("mode").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("grid").className = "grid " + m;
  $("go").className = "pri" + (m === "ex" ? " ex" : "");
  $("go").textContent = m === "rm" ? "🗑 " + TT("Remove & save") : "📤 " + TT("Extract & save");
  $("sepL").style.display = m === "ex" ? "flex" : "none";
  sync();
}
async function load(f){
  if(!f) return;
  fileName = f.name.replace(/\.pdf$/i, "");
  const buf = new Uint8Array(await f.arrayBuffer());
  let pdf;
  try{ pdf = await pdfjsLib.getDocument({data: buf.slice()}).promise; }
  catch(err){
    alert(err && err.name === "PasswordException" ? TT("This PDF is locked with a password. Unlock it first with Unlock PDF.") : TT("This PDF could not be opened. It may be damaged."));
    return;
  }
  bytes = buf; n = pdf.numPages; sel = new Set();
  $("work").style.display = ""; const g = $("grid"); g.innerHTML = "";
  for(let i = 1; i <= n; i++){
    const d = document.createElement("div"); d.className = "pg"; d.dataset.p = i;
    d.innerHTML = '<span class="mk"></span><div class="th"></div><div class="lb">' + TT("Page") + " " + i + "</div>";
    d.onclick = () => { sel.has(i) ? sel.delete(i) : sel.add(i); sync(); };
    g.appendChild(d);
  }
  setMode(mode);
  for(let i = 1; i <= n; i++){                              /* thumbnails fill in one by one */
    const pg = await pdf.getPage(i), vp0 = pg.getViewport({scale: 1}), vp = pg.getViewport({scale: 150 / Math.max(vp0.width, vp0.height)});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    const d = g.querySelector('[data-p="' + i + '"] .th'); if(d) d.appendChild(c);
  }
}
$("file").onchange = e => load(e.target.files[0]);
$("drop").ondragover = e => e.preventDefault();
$("drop").ondrop = e => { e.preventDefault(); load(e.dataTransfer.files[0]); };
$("mode").querySelectorAll("button").forEach(b => b.onclick = () => setMode(b.dataset.m));
window.addEventListener("hashchange", () => setMode(location.hash === "#extract" ? "ex" : "rm"));
$("range").oninput = () => { sel = parseRange($("range").value); sync(true); };
document.querySelectorAll(".quick button").forEach(b => b.onclick = () => {
  const q = b.dataset.q; sel = new Set();
  for(let i = 1; i <= n; i++) if((q === "odd" && i % 2) || (q === "even" && !(i % 2)) || (q === "first" && i === 1) || (q === "last" && i === n)) sel.add(i);
  sync();
});

$("go").onclick = async () => {
  if(!bytes){ alert(TT("Choose a PDF first")); return; }
  if(!sel.size){ alert(mode === "rm" ? TT("Click the pages you want to remove.") : TT("Click the pages you want to keep.")); return; }
  const keep = [];
  for(let i = 1; i <= n; i++) if(mode === "rm" ? !sel.has(i) : sel.has(i)) keep.push(i - 1);
  if(!keep.length){ alert(TT("You can't remove every page. Leave at least one.")); return; }
  let src;
  try{ src = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption: true}); }
  catch(e){ alert(TT("This PDF could not be opened. It may be damaged.")); return; }
  const build = async idx => {
    const out = await PDFLib.PDFDocument.create();
    (await out.copyPages(src, idx)).forEach(p => out.addPage(p));
    return new Blob([await out.save()], {type: "application/pdf"});
  };
  if(mode === "ex" && $("sep").checked && keep.length > 1){
    const list = [];
    for(const i of keep) list.push({blob: await build([i]), name: fileName + "-page-" + (i + 1) + ".pdf"});
    DPLResult.files(list);
  } else {
    DPLResult.file(await build(keep), fileName + (mode === "rm" ? "-edited.pdf" : "-pages-" + rangeText(sel).replace(/[ ,]+/g, "_") + ".pdf"));
  }
};
</script>
</body>
</html>
