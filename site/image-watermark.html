<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DailyPdfLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Image watermark</title>
<link rel="stylesheet" href="app.css">
<script src="lang.js"></script>
<script src="result.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3528972294042151"
     crossorigin="anonymous"></script>
<style>
  .lay{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}
  .drop{display:block;text-align:center;cursor:pointer}
  .side h3:first-child{margin-top:0}
  .side input[type=text],.side select{width:100%}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{border:0 !important;border-radius:0 !important;padding:10px !important;background:#fff}
  .seg button.on{background:#1b2030;color:#fff}
  .rng{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin:6px 0}
  .rng label{width:74px;font-weight:650}
  .rng input{flex:1}
  .rng span{width:40px;text-align:right;font-weight:650}
  .pos{display:grid;grid-template-columns:repeat(3,38px);gap:5px}
  .pos button{width:38px;height:32px;padding:0 !important;font-size:14px !important}
  .pos button.on{background:#0ca678;color:#fff;border-color:#0ca678}
  .posrow{display:flex;gap:14px;align-items:flex-start}
  .posrow .tile{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-top:6px}
  .crow{display:flex;gap:8px;align-items:center}
  .crow input[type=color]{width:40px;height:34px;padding:0 !important;border:0;background:none}
  .crow select{flex:1}
  .pri{background:#0ca678;color:#fff;border:0;width:100%;margin-top:16px}
  .stage{display:flex;justify-content:center;background:#e9ecf3;border-radius:12px;padding:16px}
  #cv{max-width:100%;max-height:70vh;box-shadow:0 3px 14px rgba(20,25,40,.18)}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .thumbs img.on{border-color:#0ca678}
  #logoBox{display:none}
  @media(max-width:900px){.lay{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box">
  <label class="drop" id="drop">💧 Choose one or more photos, or drag them here
    <input type="file" id="file" accept="image/*" multiple hidden>
  </label>
</div>
<div class="lay" id="lay" style="display:none">
  <div class="box side">
    <h3>Watermark</h3>
    <div class="seg" id="kind"><button data-k="text" class="on">Aa Text</button><button data-k="logo">🖼 Logo</button></div>
    <div id="textBox">
      <h3>Watermark text</h3>
      <input type="text" id="txt" value="© My Name" dir="auto">
      <h3>Style</h3>
      <div class="crow">
        <input type="color" id="color" value="#ffffff" title="Colour">
        <select id="font">
          <option value="700|Arial, sans-serif">Bold</option>
          <option value="400|Arial, sans-serif">Regular</option>
          <option value="700|Georgia, serif">Classic</option>
          <option value="italic 400|Georgia, serif">Italic</option>
        </select>
      </div>
      <label style="display:flex;gap:7px;align-items:center;margin-top:8px;font-size:13.5px"><input type="checkbox" id="shadow" checked> Soft shadow (easy to read on any photo)</label>
    </div>
    <div id="logoBox">
      <h3>Logo image (PNG with a clear background works best)</h3>
      <input type="file" id="logo" accept="image/*">
    </div>
    <h3>Position</h3>
    <div class="posrow">
      <div class="pos" id="pos">
        <button data-p="0">↖</button><button data-p="1">↑</button><button data-p="2">↗</button>
        <button data-p="3">←</button><button data-p="4">•</button><button data-p="5">→</button>
        <button data-p="6">↙</button><button data-p="7">↓</button><button data-p="8" class="on">↘</button>
      </div>
      <label class="tile"><input type="checkbox" id="tile"> Repeat across the photo</label>
    </div>
    <div class="rng"><label>Size</label><input type="range" id="size" min="2" max="60" value="7"><span id="sizev">7%</span></div>
    <div class="rng"><label>Opacity</label><input type="range" id="op" min="10" max="100" value="70"><span id="opv">70%</span></div>
    <div class="rng"><label>Angle</label><input type="range" id="ang" min="-90" max="90" value="0"><span id="angv">0°</span></div>
    <h3>Save as</h3>
    <select id="fmt"><option value="same">Same as original</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select>
    <button class="pri" id="save">💧 Add watermark &amp; save</button>
  </div>
  <div class="box">
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="thumbs" id="thumbs"></div>
  </div>
</div>

<script src="nav.js"></script>
<script src="install.js"></script>
<script>
const $ = id => document.getElementById(id);
const TT = s => (window.T ? T(s) : s);
let items = [], cur = 0, kind = "text", posI = 8, logo = null;

function stamp(g, W, H){
  const op = $("op").value / 100, ang = $("ang").value * Math.PI / 180, size = $("size").value / 100;
  const base = Math.min(W, H) * 0.5 + Math.max(W, H) * 0.5;       /* reacts to both sides */
  let mw, mh, draw;
  if(kind === "text"){
    const txt = $("txt").value.trim(); if(!txt) return;
    const [wt, fam] = $("font").value.split("|");
    const fs = Math.max(8, base * size * 0.6);
    g.font = wt + " " + fs + "px " + fam;
    mw = g.measureText(txt).width; mh = fs * 1.2;
    draw = () => {
      g.font = wt + " " + fs + "px " + fam; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = $("color").value;
      if($("shadow").checked){ g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = fs * 0.18; g.shadowOffsetY = fs * 0.04; }
      g.fillText(txt, 0, 0);
    };
  } else {
    if(!logo) return;
    mw = Math.max(8, base * size * 2.2); mh = mw * logo.naturalHeight / logo.naturalWidth;
    draw = () => g.drawImage(logo, -mw / 2, -mh / 2, mw, mh);
  }
  /* size of the turned mark, so it never slides off the edge */
  const bw = Math.abs(mw * Math.cos(ang)) + Math.abs(mh * Math.sin(ang));
  const bh = Math.abs(mw * Math.sin(ang)) + Math.abs(mh * Math.cos(ang));
  const at = (x, y) => { g.save(); g.globalAlpha = op; g.translate(x, y); g.rotate(ang); draw(); g.restore(); };
  if($("tile").checked){
    const sx = bw * 1.8 + W * 0.04, sy = bh * 2.6 + H * 0.04;
    let row = 0;
    for(let y = sy / 2; y < H + sy; y += sy, row++)
      for(let x = (row % 2 ? sx / 2 : 0); x < W + sx; x += sx) at(x, y);
    return;
  }
  const m = Math.min(W, H) * 0.035, col = posI % 3, row = Math.floor(posI / 3);
  const x = col === 0 ? m + bw / 2 : col === 1 ? W / 2 : W - m - bw / 2;
  const y = row === 0 ? m + bh / 2 : row === 1 ? H / 2 : H - m - bh / 2;
  at(x, y);
}

function render(){
  const it = items[cur]; if(!it) return;
  const im = it.img, cv = $("cv"), k = Math.min(1, 1100 / Math.max(im.naturalWidth, im.naturalHeight));
  cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
  const g = cv.getContext("2d");
  g.drawImage(im, 0, 0, cv.width, cv.height);
  stamp(g, cv.width, cv.height);
}
function labels(){
  $("sizev").textContent = $("size").value + "%"; $("opv").textContent = $("op").value + "%"; $("angv").textContent = $("ang").value + "°";
}
function thumbs(){
  const t = $("thumbs"); t.innerHTML = "";
  if(items.length < 2) return;
  items.forEach((it, i) => {
    const im = document.createElement("img"); im.src = it.img.src; if(i === cur) im.className = "on";
    im.onclick = () => { cur = i; thumbs(); render(); }; t.appendChild(im);
  });
}
async function add(files){
  items = []; cur = 0;
  for(const f of [...files].filter(f => /^image\//.test(f.type))){
    const im = new Image(); im.src = URL.createObjectURL(f);
    try{ await im.decode(); items.push({img: im, name: f.name.replace(/\.[^.]+$/, ""), type: f.type}); }
    catch(e){ alert(TT("This image could not be opened:") + " " + f.name); }
  }
  $("lay").style.display = items.length ? "" : "none";
  thumbs(); render();
}
$("file").onchange = e => add(e.target.files);
$("drop").ondragover = e => e.preventDefault();
$("drop").ondrop = e => { e.preventDefault(); add(e.dataTransfer.files); };
$("logo").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const im = new Image(); im.src = URL.createObjectURL(f);
  try{ await im.decode(); logo = im; render(); }catch(err){ alert(TT("This image could not be opened:") + " " + f.name); }
};
$("kind").querySelectorAll("button").forEach(b => b.onclick = () => {
  kind = b.dataset.k; $("kind").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  $("textBox").style.display = kind === "text" ? "" : "none"; $("logoBox").style.display = kind === "logo" ? "block" : "none";
  if(kind === "logo" && $("size").value < 8){ $("size").value = 12; labels(); }
  render();
});
$("pos").querySelectorAll("button").forEach(b => b.onclick = () => {
  posI = Number(b.dataset.p); $("tile").checked = false;
  $("pos").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); render();
});
["txt", "color", "font", "shadow", "tile", "size", "op", "ang"].forEach(id => $(id).addEventListener("input", () => { labels(); render(); }));
$("tile").addEventListener("change", () => { if($("tile").checked && $("ang").value == 0){ $("ang").value = -30; $("op").value = Math.min($("op").value, 35); labels(); } render(); });

$("save").onclick = async () => {
  if(!items.length){ alert(TT("Choose a photo first")); return; }
  if(kind === "text" && !$("txt").value.trim()){ alert(TT("Type the watermark text first")); return; }
  if(kind === "logo" && !logo){ alert(TT("Choose a logo image first")); return; }
  const out = [];
  for(const it of items){
    const c = document.createElement("canvas"); c.width = it.img.naturalWidth; c.height = it.img.naturalHeight;
    const g = c.getContext("2d");
    let type = $("fmt").value === "same" ? (/png|webp/.test(it.type) ? it.type : "image/jpeg") : $("fmt").value;
    if(type === "image/jpeg"){ g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); }
    g.drawImage(it.img, 0, 0); stamp(g, c.width, c.height);
    const ext = {"image/jpeg": "jpg", "image/png": "png", "image/webp": "webp"}[type];
    const blob = await new Promise(r => c.toBlob(r, type, 0.92));
    out.push({blob: blob, name: it.name + "-watermark." + ext});
  }
  if(out.length === 1) DPLResult.file(out[0].blob, out[0].name); else DPLResult.files(out);
};
labels();
</script>
</body>
</html>
